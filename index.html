<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="东南大学 PALM 实验室冯磊课题组的组织首页。">
  <meta name="referrer" content="same-origin">
  <title>冯磊课题组</title>
  <link rel="stylesheet" href="site.css">
  <!-- LAB_HEAD -->
</head>
<body>
  <a class="skip-link" href="#main-content">跳到正文</a>
  <header class="site-header" id="top">
    <div class="wrap header-inner">
      <a class="brand" href="#top">
        <span class="brand-mark" aria-hidden="true"></span>
        <span><span class="brand-name">冯磊课题组</span><span class="brand-subtitle">SEU-PALM</span></span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <!-- LAB_NAV -->
        <a href="https://github.com/SEU-PALM-FLGroup">GitHub</a>
        <a href="https://palm.seu.edu.cn/intro.html">PALM 实验室</a>
      </nav>
      <!-- AUTH_FORM -->
    </div>
  </header>
  <main id="main-content" tabindex="-1">
    <section class="hero wrap" aria-labelledby="page-title">
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="eyebrow">东南大学 PALM 实验室</p>
          <h1 id="page-title">冯磊课题组</h1>
          <p>查看课题组的公开项目和代码仓库。</p>
          <a class="hero-link" href="https://github.com/orgs/SEU-PALM-FLGroup/repositories">浏览公开仓库</a>
        </div>
        <div class="hero-art" aria-hidden="true"></div>
      </div>
    </section>

    <template id="lab-resources">
      <div class="wrap">
        <nav class="quick-links" aria-label="资料入口">
          <a class="quick-link" href="#members">
            <span class="quick-title">课题组成员与当前事项</span>
            <span class="quick-copy">博士生、硕士生、当前分工和在研项目</span>
          </a>
          <a class="quick-link" href="#policy">
            <span class="quick-title">课题组管理细则</span>
            <span class="quick-copy">毕业要求、公共服务计分、论文奖励和报销</span>
          </a>
          <a class="quick-link" href="#writing">
            <span class="quick-title">英文论文写作注意事项</span>
            <span class="quick-copy">标题、摘要、正文、实验和参考文献</span>
          </a>
        </nav>

        <section class="search-panel" aria-label="站内搜索" hidden>
          <form class="search-form" role="search">
            <label for="site-search">检索资料</label>
            <div class="search-inputs">
              <input id="site-search" type="search" placeholder="输入姓名、项目或关键词" maxlength="100" autocomplete="off" spellcheck="false" required>
              <button type="submit">搜索</button>
            </div>
          </form>
          <p id="search-status" role="status"></p>
          <ul id="search-results"></ul>
        </section>
        <!-- LAB_DOCUMENTS -->
      </div>
    </template><!-- LAB_RESOURCES_END -->
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>SEU-PALM 冯磊课题组</span>
      <a href="#top">返回页首</a>
    </div>
  </footer>
</body>
</html>
